name: Repository quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation and release artifacts
        shell: python
        run: |
          from pathlib import Path
          import json
          import zipfile
          required = ["README.md", "LICENSE", "CITATION.cff", "CONTRIBUTING.md", "SECURITY.md", "docs/VALIDATION.md"]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit(f"Missing required files: {missing}")
          if len(Path("README.md").read_text(encoding="utf-8").strip()) < 500:
              raise SystemExit("README.md is too short.")
          for path in Path(".").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          for path in Path(".").rglob("*.zip"):
              if not zipfile.is_zipfile(path):
                  raise SystemExit(f"Invalid ZIP archive: {path}")
